name: CI & Deployment Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Ruff Linter Check
        run: ruff check src backend tests scripts
      - name: Black Formatting Check
        run: black --check src backend tests scripts
      - name: Generate synthetic dataset & Smoke Train
        run: |
          python scripts/download_data.py
          python -m credence.train 5
      - name: Run Pytest with Coverage
        run: pytest --cov --cov-report=xml
      - name: Upload coverage artifact
        uses: codecov/codecov-action@v4
        continue-on-error: true

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install
      - name: TypeScript & Vite Build
        run: npm --prefix frontend run build
