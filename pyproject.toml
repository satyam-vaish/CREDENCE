[project]
name = "credence"
version = "1.0.0"
description = "Credit default prediction - end-to-end MLOps pipeline"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "--cov=credence --cov=backend --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
