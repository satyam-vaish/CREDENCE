data:
  raw_path: data/raw/loans.csv          # override with CREDENCE_DATA_PATH env
  n_months: 48
  rows_per_month: 900
  seed: 42

split:                                  # time-based only — no random splits anywhere
  train_last_month: 29                  # months 0..29
  val_last_month: 35                    # months 30..35
  # months 36..47 = "live simulation"

cost:                                   # business costs for threshold search
  cost_fn: 5.0                          # missed default (false negative)
  cost_fp: 1.0                          # wrongly declined good loan (false positive)

optuna:
  n_trials: 25                          # drop to 5 for CI smoke train
  seed: 7

mlflow:
  tracking_uri: http://localhost:5000   # falls back to ./mlruns if unreachable
  experiment: credit-default

registry:
  name: credit-default-model
  dir: models/registry

drift:
  psi_moderate: 0.10
  psi_significant: 0.25
  max_share_before_retrain: 0.30
  key_features: [int_rate, dti, revol_util]

api:
  host: 0.0.0.0
  port: 8000
