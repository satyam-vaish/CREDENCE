services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - MODEL_DIR=/app/models/registry/credit-default-model
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models:ro
    depends_on: [mlflow]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes: [mlflow:/mlflow]
    ports: ["5000:5000"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/dash.yml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/credence.json:ro
    ports: ["3001:3000"]

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  mlflow:
